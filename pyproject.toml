[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fakenews"
version = "0.1.0"
description = "Fake news detection benchmark: TF-IDF vs fine-tuned DistilBERT vs LLM, on a leakage-cleaned dataset"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Amine Charfeddine" }]
dependencies = [
  "pandas>=2.0",
  "numpy>=1.24",
  "scikit-learn>=1.3",
  "joblib>=1.3",
  "matplotlib>=3.7",
]

[project.optional-dependencies]
transformer = ["torch>=2.1", "transformers>=4.40"]
llm = ["openai>=1.30"]
app = ["gradio>=4.0"]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
